<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Gravity</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --text: #d7dae2;
    --muted: #8a8fa0;
    --accent: #6e9fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    padding: 16px;
    gap: 12px;
    overflow: hidden;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; flex-shrink: 0; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }
  #viewport {
    flex: 1;
    align-self: stretch;
    min-height: 0;
    display: flex;
    gap: 12px;
  }
  #stage {
    flex: 1;
    min-width: 0;
  }
  #viewPanel {
    flex-shrink: 0;
    width: 56px;
    background: var(--panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 0;
  }
  #viewPanel .group-title {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  #viewPanel output {
    color: var(--text);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  #zoom {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 20px;
    height: 150px;
    accent-color: var(--accent);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    background: #090a0e;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    touch-action: none;
  }
  .nogpu {
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    padding: 24px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 0;
    align-items: stretch;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 14px;
    flex-shrink: 0;
  }
  .group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 0 14px;
  }
  .group + .group { border-left: 1px solid rgba(255,255,255,0.08); }
  .group-title {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .group-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .controls > button { align-self: center; margin-left: 14px; }
  .control { display: flex; flex-direction: column; gap: 2px; }
  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 0.75rem;
  }
  .control label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .control label output { color: var(--text); }
  input[type="range"] {
    width: 90px;
    accent-color: var(--accent);
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    align-self: center;
  }
  label.check input {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    margin: 0;
  }
  button {
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.14);
    font-weight: 500;
  }
  button.ghost:hover { color: var(--text); filter: none; background: rgba(255,255,255,0.06); }
  button.ghost.ok { color: var(--accent); border-color: var(--accent); }
  h1 a.nav {
    margin-left: 14px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    padding: 4px 10px;
    vertical-align: middle;
  }
  h1 a.nav:hover { color: var(--text); background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <h1>Color Gravity <span>similar hues attract</span>
    <a class="nav" href="galaxies.html">Galaxies</a>
    <a class="nav" href="fractals.html">Fractals</a>
  </h1>
  <div id="viewport">
    <div id="stage"><canvas id="sim"></canvas></div>
    <div id="viewPanel">
      <span class="group-title">Zoom</span>
      <input type="range" id="zoom" min="1" max="3" step="0.05" value="1">
      <output id="zoomOut">1.0×</output>
    </div>
  </div>
  <div class="controls">
    <div class="group">
      <span class="group-title">Boules</span>
      <div class="group-row">
        <div class="control">
          <label>Nombre <output id="countOut">1000</output></label>
          <input type="range" id="count" min="20" max="20000" step="10" value="1000">
        </div>
        <div class="control">
          <label>Diamètre <output id="sizeOut">10</output></label>
          <input type="range" id="size" min="2" max="24" step="1" value="10">
        </div>
        <div class="control">
          <label>Couleurs</label>
          <select id="palette">
            <option value="rainbow" selected>Arc-en-ciel</option>
            <option value="neon">Néon</option>
            <option value="pastel">Pastel</option>
            <option value="jewel">Joyaux</option>
            <option value="sunset">Coucher de soleil</option>
            <option value="ocean">Océan</option>
            <option value="warm">Chaudes</option>
            <option value="cold">Froides</option>
          </select>
        </div>
      </div>
    </div>
    <div class="group">
      <span class="group-title">Physique</span>
      <div class="group-row">
        <div class="control">
          <label>Globale <output id="gGlobalOut">0.0</output></label>
          <input type="range" id="gGlobal" min="0" max="6" step="0.1" value="0">
        </div>
        <div class="control">
          <label>Couleur <output id="gColorOut">1.5</output></label>
          <input type="range" id="gColor" min="0" max="6" step="0.1" value="1.5">
        </div>
        <div class="control">
          <label>Friction <output id="frictionOut">0.005</output></label>
          <input type="range" id="friction" min="0" max="0.2" step="0.005" value="0.005">
        </div>
      </div>
    </div>
    <div class="group">
      <span class="group-title">Palet</span>
      <div class="group-row">
        <div class="control">
          <label>Taille <output id="mouseROut">10</output></label>
          <input type="range" id="mouseR" min="10" max="150" step="5" value="10">
        </div>
        <label class="check">
          <input type="checkbox" id="paletSolid" checked>
          Collision
        </label>
        <label class="check">
          <input type="checkbox" id="paletAttract" checked>
          Attraction
        </label>
        <label class="check">
          <input type="checkbox" id="paletBang" checked>
          Big bang
        </label>
        <label class="check">
          <input type="checkbox" id="paletScoop">
          Pelle
        </label>
      </div>
    </div>
    <button id="debugCopy" type="button" class="ghost">Debug</button>
    <button id="reset">Re-mix</button>
  </div>

<script>
"use strict";
// WebGPU-only engine: the pairwise physics runs in compute shaders and the
// balls are drawn as instanced quads. Ball state (positions, velocities)
// lives permanently on the GPU — the CPU only uploads initial state and a
// small uniform block per frame, so ball count barely touches the CPU.

const canvas = document.getElementById("sim");
const stage = document.getElementById("stage");
let W = 0, H = 0;

const MAXN = 20000; // GPU buffer capacity, matches the slider max

// spatial grid: balls only test others in their own neighborhood instead
// of every other ball. CELL_SIZE sets that neighborhood's scale; MAXCELLS
// bounds the grid buffers for a worst-case canvas size, and cellSize grows
// automatically (see computeGrid) if a huge canvas would otherwise need
// more cells than that.
const CELL_SIZE = 120;
const MAXCELLS = 8192;
const GRID_TARGET_CELLS = 4000;

function computeGrid(w, h) {
  let cellSize = CELL_SIZE;
  if ((w / cellSize) * (h / cellSize) > GRID_TARGET_CELLS) {
    cellSize = Math.sqrt((w * h) / GRID_TARGET_CELLS);
  }
  const cols = Math.max(1, Math.floor(w / cellSize));
  const rows = Math.max(1, Math.floor(h / cellSize));
  return { cols, rows, cellW: w / cols, cellH: h / rows, numCells: cols * rows };
}

const params = {
  count: 1000,
  gGlobal: 0,       // universal pull — holds the whole blob together
  gColor: 1.5,      // × affinity — sorts by hue (old single "Force")
  friction: 0.005,  // linear + quadratic drag (ex-Vitesse folded in)
  radius: 5,
  palette: "rainbow",
  zoom: 1,          // camera-only: simulation always runs in world space (≥1)
  panX: 0,          // world-space camera offset (only useful when zoom > 1)
  panY: 0,
  paletSolid: true,   // hover disc shoves balls (off = pass-through)
  paletAttract: true, // hold → local gravity well (1/d falloff)
  paletBang: true,    // release → outward blast
  paletScoop: false,  // hold → carry balls inside the disc (overrides attract/bang)
};

// after diameter changes: 1 → 0 over ~45 frames; drives GPU unjam push + min speed
let unjamBoost = 0;

function clampPan() {
  if (params.zoom <= 1) {
    params.panX = 0;
    params.panY = 0;
    return;
  }
  const maxX = (W * 0.5) * (1 - 1 / params.zoom);
  const maxY = (H * 0.5) * (1 - 1 / params.zoom);
  params.panX = Math.max(-maxX, Math.min(maxX, params.panX));
  params.panY = Math.max(-maxY, Math.min(maxY, params.panY));
}

function setZoom(z) {
  params.zoom = Math.min(3, Math.max(1, z));
  const el = document.getElementById("zoom");
  const out = document.getElementById("zoomOut");
  if (el) el.value = String(params.zoom);
  if (out) out.textContent = params.zoom.toFixed(1) + "×";
  clampPan();
  saveSettings();
}

// screen (canvas CSS px) → world coords, inverting zoom + pan
function screenToWorld(x, y) {
  const cx = W / 2, cy = H / 2;
  return {
    x: (x - cx) / params.zoom + cx + params.panX,
    y: (y - cy) / params.zoom + cy + params.panY,
  };
}

// mouse acts as a solid disc that shoves balls out of its way — hold the
// button down to switch it into a "big bang" charger instead: it sucks
// every ball toward the cursor while held, then releasing fires an
// outward blast whose strength depends on how long it charged.
const CHARGE_MAX = 0.35;      // pull strength once fully charged
const CHARGE_RAMP_MS = 1100;  // hold time to reach full charge
const EXPLODE_FRAMES = 20;    // blast duration, in frames
const EXPLODE_SCALE = 6000;   // charge (0..CHARGE_MAX) → blast strength

const mouse = {
  x: -1e9, y: -1e9, vx: 0, vy: 0, radius: 10, active: false,
  charging: false, chargeStart: 0, chargeNow: 0,
  scooping: false,
  explodeTimer: 0, explodeStrength0: 0, explodeX: 0, explodeY: 0, explodeNow: 0,
};

const SETTINGS_KEY = "color-gravity-settings";

function saveSettings() {
  try {
    localStorage.setItem(SETTINGS_KEY, JSON.stringify({
      count: params.count,
      gGlobal: params.gGlobal,
      gColor: params.gColor,
      friction: params.friction,
      radius: params.radius,
      palette: params.palette,
      zoom: params.zoom,
      paletSolid: params.paletSolid,
      paletAttract: params.paletAttract,
      paletBang: params.paletBang,
      paletScoop: params.paletScoop,
      mouseRadius: mouse.radius,
    }));
  } catch (_) { /* private mode / quota */ }
}

function clampNum(v, lo, hi, fallback) {
  const n = Number(v);
  if (!Number.isFinite(n)) return fallback;
  return Math.min(hi, Math.max(lo, n));
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    params.count = clampNum(s.count, 20, MAXN, params.count);
    params.gGlobal = clampNum(s.gGlobal, 0, 6, params.gGlobal);
    params.gColor = clampNum(s.gColor, 0, 6, params.gColor);
    params.friction = clampNum(s.friction, 0, 0.2, params.friction);
    params.radius = clampNum(s.radius, 1, 12, params.radius);
    if (typeof s.palette === "string") params.palette = s.palette;
    params.zoom = clampNum(s.zoom, 1, 3, params.zoom);
    if (typeof s.paletSolid === "boolean") params.paletSolid = s.paletSolid;
    if (typeof s.paletAttract === "boolean") params.paletAttract = s.paletAttract;
    if (typeof s.paletBang === "boolean") params.paletBang = s.paletBang;
    if (typeof s.paletScoop === "boolean") params.paletScoop = s.paletScoop;
    mouse.radius = clampNum(s.mouseRadius, 10, 150, mouse.radius);
  } catch (_) { /* corrupt JSON */ }
}

function syncControlsFromParams() {
  const set = (id, val, outId, text) => {
    const el = document.getElementById(id);
    if (el) el.value = String(val);
    if (outId) {
      const out = document.getElementById(outId);
      if (out) out.textContent = text;
    }
  };
  set("count", params.count, "countOut", String(params.count));
  set("gGlobal", params.gGlobal, "gGlobalOut", params.gGlobal.toFixed(1));
  set("gColor", params.gColor, "gColorOut", params.gColor.toFixed(1));
  set("friction", params.friction, "frictionOut", params.friction.toFixed(3));
  set("size", params.radius * 2, "sizeOut", String(params.radius * 2));
  set("mouseR", mouse.radius, "mouseROut", String(mouse.radius));
  set("zoom", params.zoom, "zoomOut", params.zoom.toFixed(1) + "×");
  const pal = document.getElementById("palette");
  if (pal) pal.value = params.palette;
  const solid = document.getElementById("paletSolid");
  if (solid) solid.checked = params.paletSolid;
  const attr = document.getElementById("paletAttract");
  if (attr) attr.checked = params.paletAttract;
  const bang = document.getElementById("paletBang");
  if (bang) bang.checked = params.paletBang;
  const scoop = document.getElementById("paletScoop");
  if (scoop) scoop.checked = params.paletScoop;
}

// Shareable overrides — URL wins over localStorage.
// Circle: ?preset=circle
// Or: ?count=1500&diameter=10&gGlobal=0&gColor=2&friction=0.005&palette=rainbow
const CIRCLE_PRESET = {
  count: 1500,
  gGlobal: 0,
  gColor: 2,
  friction: 0.005,
  radius: 5,
  palette: "rainbow",
  zoom: 1,
  paletSolid: true,
  paletAttract: true,
  paletBang: true,
  paletScoop: false,
  mouseRadius: 40,
};

function applySettingsObject(s) {
  if (s.count != null) params.count = clampNum(s.count, 20, MAXN, params.count);
  if (s.gGlobal != null) params.gGlobal = clampNum(s.gGlobal, 0, 6, params.gGlobal);
  if (s.gColor != null) params.gColor = clampNum(s.gColor, 0, 6, params.gColor);
  if (s.friction != null) params.friction = clampNum(s.friction, 0, 0.2, params.friction);
  if (s.radius != null) params.radius = clampNum(s.radius, 1, 12, params.radius);
  if (typeof s.palette === "string") params.palette = s.palette;
  if (s.zoom != null) params.zoom = clampNum(s.zoom, 1, 3, params.zoom);
  if (typeof s.paletSolid === "boolean") params.paletSolid = s.paletSolid;
  if (typeof s.paletAttract === "boolean") params.paletAttract = s.paletAttract;
  if (typeof s.paletBang === "boolean") params.paletBang = s.paletBang;
  if (typeof s.paletScoop === "boolean") params.paletScoop = s.paletScoop;
  if (s.mouseRadius != null) mouse.radius = clampNum(s.mouseRadius, 10, 150, mouse.radius);
}

function loadFromURL() {
  const q = new URLSearchParams(location.search);
  if (![...q.keys()].length) return;
  if (q.get("preset") === "circle") applySettingsObject(CIRCLE_PRESET);
  if (q.has("count")) params.count = clampNum(q.get("count"), 20, MAXN, params.count);
  if (q.has("gGlobal")) params.gGlobal = clampNum(q.get("gGlobal"), 0, 6, params.gGlobal);
  if (q.has("gColor")) params.gColor = clampNum(q.get("gColor"), 0, 6, params.gColor);
  if (q.has("friction")) params.friction = clampNum(q.get("friction"), 0, 0.2, params.friction);
  if (q.has("diameter")) params.radius = clampNum(q.get("diameter"), 2, 24, params.radius * 2) / 2;
  if (q.has("radius")) params.radius = clampNum(q.get("radius"), 1, 12, params.radius);
  if (q.has("palette")) params.palette = q.get("palette");
  if (q.has("zoom")) params.zoom = clampNum(q.get("zoom"), 1, 3, params.zoom);
  if (q.has("mouseR")) mouse.radius = clampNum(q.get("mouseR"), 10, 150, mouse.radius);
  if (q.has("solid")) params.paletSolid = q.get("solid") !== "0";
  if (q.has("attract")) params.paletAttract = q.get("attract") !== "0";
  if (q.has("bang")) params.paletBang = q.get("bang") !== "0";
  if (q.has("scoop")) params.paletScoop = q.get("scoop") === "1";
}

loadSettings();
loadFromURL();
syncControlsFromParams();

canvas.addEventListener("pointermove", (e) => {
  const rect = canvas.getBoundingClientRect();
  const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  if (mouse.active) {
    // cursor velocity, so a fast swipe smacks balls harder
    mouse.vx = w.x - mouse.x;
    mouse.vy = w.y - mouse.y;
  }
  mouse.x = w.x;
  mouse.y = w.y;
  mouse.active = true;
});
canvas.addEventListener("pointerleave", () => {
  mouse.active = false;
  mouse.scooping = false;
  mouse.x = -1e9;
  mouse.y = -1e9;
  mouse.vx = 0;
  mouse.vy = 0;
});
canvas.addEventListener("pointerdown", (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const w = screenToWorld(e.clientX - rect.left, e.clientY - rect.top);
  mouse.x = w.x;
  mouse.y = w.y;
  mouse.active = true;
  if (params.paletScoop) {
    mouse.scooping = true;
    mouse.charging = false;
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    return;
  }
  if (params.paletAttract || params.paletBang) {
    mouse.charging = true;
    mouse.chargeStart = performance.now();
  }
});
// listen on window, not the canvas, so releasing off-canvas still fires
// the blast instead of leaving the charge stuck
window.addEventListener("pointerup", () => {
  if (mouse.charging && params.paletBang) {
    mouse.explodeStrength0 = mouse.chargeNow * EXPLODE_SCALE;
    mouse.explodeX = mouse.x;
    mouse.explodeY = mouse.y;
    mouse.explodeTimer = EXPLODE_FRAMES;
  }
  mouse.charging = false;
  mouse.scooping = false;
});

// Trackpad / mouse on Mac:
//   pinch (ctrl+wheel) → zoom
//   Option/Alt + scroll → zoom (mouse wheel)
//   two-finger / wheel scroll when zoomed → pan
canvas.addEventListener("wheel", (e) => {
  e.preventDefault();
  let dx = e.deltaX, dy = e.deltaY;
  if (e.deltaMode === 1) { dx *= 16; dy *= 16; }
  else if (e.deltaMode === 2) { dx *= W; dy *= H; }

  if (e.ctrlKey || e.metaKey || e.altKey) {
    // pinch, or Option+wheel → zoom
    setZoom(params.zoom * Math.exp(-dy * 0.01));
    return;
  }
  if (params.zoom > 1) {
    params.panX += dx / params.zoom;
    params.panY += dy / params.zoom;
    clampPan();
  }
}, { passive: false });

/* ------------------------------ palettes ------------------------------ */
// each palette maps ball index → hue (+ saturation/lightness treatment);
// a gentle lightness wobble gives varied tones within nearby hues, and
// the hue is what the attraction physics sorts on.
// Themed palettes are multi-stop gradients interpolated in HSL: hue,
// saturation and lightness all drift along the ramp, so every ball keeps
// a unique tone instead of the palette reading as a handful of colors.
// Stops use unwrapped hue degrees (may exceed 360) so interpolation
// never takes the short way around the wheel.
const GRADIENTS = {
  // deep violet → magenta → crimson → orange → gold
  sunset: [[265,85,30],[320,92,44],[352,95,52],[375,95,56],[395,95,63],[412,90,71]],
  // abyssal navy → azure → teal → turquoise → pale seafoam
  ocean:  [[228,85,26],[208,88,38],[192,92,46],[178,88,53],[165,80,61],[155,62,73]],
  // burgundy → red → ember orange → amber → gold → warm cream
  warm:   [[343,85,32],[358,92,45],[372,95,52],[388,95,57],[402,92,64],[413,85,75]],
  // soft lavender → indigo → cobalt → sky → cyan → glacial ice
  cold:   [[278,62,58],[252,76,55],[226,88,52],[206,92,58],[190,88,65],[181,68,79]],
};

function gradientColor(stops, t, wob) {
  const x = t * (stops.length - 1);
  const k = Math.min(Math.floor(x), stops.length - 2);
  const f = x - k;
  const a = stops[k], b = stops[k + 1];
  return {
    hue: (a[0] + (b[0] - a[0]) * f) % 360,
    sat: a[1] + (b[1] - a[1]) * f + wob * 3,
    light: a[2] + (b[2] - a[2]) * f + wob * 4,
  };
}

function ballColor(i, n) {
  const t = i / n;
  const wob = Math.sin(t * Math.PI * 12); // -1..1, cycles along the palette
  const stops = GRADIENTS[params.palette];
  if (stops) return gradientColor(stops, t, wob);
  switch (params.palette) {
    case "neon":   return { hue: t * 360, sat: 100, light: 56 + wob * 8 };
    case "pastel": return { hue: t * 360, sat: 65,  light: 76 + wob * 6 };
    case "jewel":  return { hue: t * 360, sat: 85,  light: 40 + wob * 9 };
    default:       return { hue: t * 360, sat: 90,  light: 60 };
  }
}

function hslToRgb(h, s, l) {
  s /= 100; l /= 100;
  h = ((h % 360) + 360) % 360;
  const c = (1 - Math.abs(2 * l - 1)) * s;
  const x = c * (1 - Math.abs((h / 60) % 2 - 1));
  const m = l - c / 2;
  let r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  return [r + m, g + m, b + m];
}

/* ----------------------------- ball state ----------------------------- */
// flat typed arrays, uploaded to the GPU whenever the set of balls changes
const posA = new Float32Array(MAXN * 2);
const velA = new Float32Array(MAXN * 2);
const hueA = new Float32Array(MAXN);
const colA = new Float32Array(MAXN * 4);

function makeBalls(n) {
  params.count = n;
  // shuffle color assignment so draw order ≠ hue order — otherwise rainbow
  // paints one end of the spectrum systematically on top when balls overlap
  const order = new Uint32Array(n);
  for (let i = 0; i < n; i++) order[i] = i;
  for (let i = n - 1; i > 0; i--) {
    const j = (Math.random() * (i + 1)) | 0;
    const t = order[i]; order[i] = order[j]; order[j] = t;
  }
  for (let i = 0; i < n; i++) {
    posA[i * 2] = params.radius + Math.random() * (W - 2 * params.radius);
    posA[i * 2 + 1] = params.radius + Math.random() * (H - 2 * params.radius);
    velA[i * 2] = 0;
    velA[i * 2 + 1] = 0;
    const { hue, sat, light } = ballColor(order[i], n);
    hueA[i] = hue;
    const [r, g, b] = hslToRgb(hue, sat, light);
    colA[i * 4] = r; colA[i * 4 + 1] = g; colA[i * 4 + 2] = b; colA[i * 4 + 3] = 1;
  }
  if (gpu) gpu.upload();
}

/* ------------------------------ shaders ------------------------------- */

const WGSL_SIM = /* wgsl */`
struct Params {
  size: vec2f,
  gGlobal: f32,      // universal attraction
  friction: f32,
  gColor: f32,       // × affinity — color sorting
  attractFlag: f32,  // palet attract enable (0/1)
  radius: f32,
  count: f32,
  mouse: vec4f,      // x, y, vx, vy
  mouseR: f32,
  mouseActive: f32,
  dragK: f32,         // quadratic (Newton) drag coefficient
  zoom: f32,          // camera zoom (sim ignores; shared uniform with draw)
  grid: vec4f,        // cols, rows, cellW, cellH
  interact: vec4f,    // explodeX, explodeY, explodeStrength, chargeStrength
  pan: vec2f,         // camera pan (draw uses; sim ignores)
  _padPan: vec2f,     // x: palet solid (0/1), y: unjam boost after size change
};
@group(0) @binding(0) var<uniform> p: Params;
@group(0) @binding(1) var<storage, read_write> pos: array<vec2f>;
@group(0) @binding(2) var<storage, read_write> vel: array<vec2f>;
@group(0) @binding(3) var<storage, read> hue: array<f32>;
@group(0) @binding(4) var<storage, read_write> counts: array<atomic<u32>>;
@group(0) @binding(5) var<storage, read_write> cellId: array<u32>;
@group(0) @binding(6) var<storage, read_write> offsets: array<u32>;
@group(0) @binding(7) var<storage, read_write> sortedIdx: array<u32>;

const PI = 3.14159265;
const NEIGH: i32 = 2; // max 5×5 — actual search radius shrinks with ball size / cell size

// circular hue affinity: 1 for identical hues → 0 at 180° apart, ^4 so
// attraction is sharply selective (attraction-only setups collapse into
// one blob without this)
fn affinity(a: f32, b: f32) -> f32 {
  var d = abs(a - b) % 360.0;
  if (d > 180.0) { d = 360.0 - d; }
  let c = cos(d / 180.0 * PI) * 0.5 + 0.5;
  let c2 = c * c;
  return c2 * c2;
}

fn cellCoord(position: vec2f) -> vec2i {
  let cx = i32(clamp(floor(position.x / p.grid.z), 0.0, p.grid.x - 1.0));
  let cy = i32(clamp(floor(position.y / p.grid.w), 0.0, p.grid.y - 1.0));
  return vec2i(cx, cy);
}

// how many cells out we must walk to cover rangePx (clamped to NEIGH)
fn neighFor(rangePx: f32) -> i32 {
  let cell = min(p.grid.z, p.grid.w);
  return min(NEIGH, max(1, i32(ceil(rangePx / cell))));
}

/* --- spatial grid build: counting sort of ball indices into cells ------
   (histogram -> prefix sum -> scatter), rebuilt fresh every frame since
   balls move each step. forces() below walks this instead of all n balls. */

@compute @workgroup_size(256)
fn clearCounts(@builtin(global_invocation_id) gid: vec3u) {
  let numCells = u32(p.grid.x) * u32(p.grid.y);
  if (gid.x >= numCells) { return; }
  atomicStore(&counts[gid.x], 0u);
}

@compute @workgroup_size(256)
fn countCells(@builtin(global_invocation_id) gid: vec3u) {
  let n = u32(p.count);
  let i = gid.x;
  if (i >= n) { return; }
  let cc = cellCoord(pos[i]);
  let c = u32(cc.y) * u32(p.grid.x) + u32(cc.x);
  cellId[i] = c;
  atomicAdd(&counts[c], 1u);
}

// single-thread exclusive scan: at a few thousand cells this is microseconds
// on GPU, far cheaper than the bookkeeping a parallel scan would need here
@compute @workgroup_size(1)
fn prefixSum() {
  let numCells = u32(p.grid.x) * u32(p.grid.y);
  var running = 0u;
  for (var c = 0u; c < numCells; c++) {
    let cnt = atomicLoad(&counts[c]);
    offsets[c] = running;
    running += cnt;
    atomicStore(&counts[c], offsets[c]); // repurpose as the scatter cursor
  }
  offsets[numCells] = running;
}

@compute @workgroup_size(256)
fn scatter(@builtin(global_invocation_id) gid: vec3u) {
  let n = u32(p.count);
  let i = gid.x;
  if (i >= n) { return; }
  let c = cellId[i];
  let slot = atomicAdd(&counts[c], 1u);
  sortedIdx[slot] = i;
}

/* --- physics: each ball only tests balls in its own 5x5 cell neighborhood
   instead of every other ball. This caps interaction reach at roughly
   NEIGH*cellSize px instead of the whole canvas — negligible for the
   force itself (1/d falloff already makes distant pairs weak) but it does
   mean two same-hue balls on opposite sides of a big canvas no longer
   pull on each other until they're already reasonably close. */

@compute @workgroup_size(256)
fn forces(@builtin(global_invocation_id) gid: vec3u) {
  let n = u32(p.count);
  let i = gid.x;
  if (i >= n) { return; }
  let myPos = pos[i];
  let myHue = hue[i];
  var acc = vec2f(0.0, 0.0);
  // Proven circle-sorting balance (pre-pâté tweaks): full neighborhood,
  // soft≈20, attraction always on, linear differential push.
  let collideDist = p.radius * 2.2;
  let soft = 20.0;
  let unjam = p._padPan.y;
  // tiny balls need a harder short-range push or they still stack
  let pushGain = select(1.0, max(1.0, 4.0 / max(p.radius, 1.0)), p.radius < 3.5);
  let cc = cellCoord(myPos);
  let cols = i32(p.grid.x);
  let rows = i32(p.grid.y);

  for (var oy = -NEIGH; oy <= NEIGH; oy++) {
    let ny = cc.y + oy;
    if (ny < 0 || ny >= rows) { continue; }
    for (var ox = -NEIGH; ox <= NEIGH; ox++) {
      let nx = cc.x + ox;
      if (nx < 0 || nx >= cols) { continue; }
      let c = u32(ny * cols + nx);
      let start = offsets[c];
      let end = offsets[c + 1u];
      for (var s = start; s < end; s++) {
        let j = sortedIdx[s];
        if (j == i) { continue; }
        var dxy = pos[j] - myPos;
        var d2 = dot(dxy, dxy);
        if (d2 < 0.01) {
          let a = f32(i) * 12.9898 + f32(j) * 78.233;
          dxy = vec2f(cos(a), sin(a));
          d2 = 1.0;
        }
        let invD = inverseSqrt(d2);
        let d = d2 * invD;
        let dir = dxy * invD;
        let aff = affinity(myHue, hue[j]);
        // Globale + Couleur×aff across the whole 5×5 neighborhood —
        // short-range-only color was why the hue circle never closed
        var f = dir * ((p.gGlobal + p.gColor * aff) / (d + soft));
        if (d < collideDist) {
          let overlap = (collideDist - d) / collideDist;
          let push = overlap * 0.6 * (1.5 + 3.0 * (1.0 - aff))
            * pushGain * (1.0 + 6.0 * unjam);
          f -= dir * push;
        }
        acc += f;
      }
    }
  }
  vel[i] += acc;
}

@compute @workgroup_size(256)
fn integrate(@builtin(global_invocation_id) gid: vec3u) {
  let n = u32(p.count);
  let i = gid.x;
  if (i >= n) { return; }
  var v = vel[i];
  var x = pos[i];
  let reach = p.mouseR + p.radius;
  // interact.w = hold charge; mouseActive 2 = scooping (pelle)
  let charge = p.interact.w;
  let scooping = p.mouseActive > 1.5;
  let attracting = !scooping && charge > 0.001 && p.attractFlag > 0.5;
  let solid = p._padPan.x > 0.5;

  // Pelle: balls inside the disc are carried with the cursor (kinematic)
  if (scooping) {
    let dxy0 = x - p.mouse.xy;
    let d0 = length(dxy0);
    if (d0 < reach) {
      x = x + p.mouse.zw;
      var dxy = x - p.mouse.xy;
      var d = length(dxy);
      if (d > reach) {
        x = p.mouse.xy + dxy * (reach / max(d, 0.001));
      }
      v = p.mouse.zw;
      // wall clamp only — skip friction / solid / attract this frame
      if (x.x < p.radius) { x.x = p.radius; v.x = -v.x; }
      if (x.x > p.size.x - p.radius) { x.x = p.size.x - p.radius; v.x = -v.x; }
      if (x.y < p.radius) { x.y = p.radius; v.y = -v.y; }
      if (x.y > p.size.y - p.radius) { x.y = p.size.y - p.radius; v.y = -v.y; }
      pos[i] = x;
      vel[i] = v;
      return;
    }
  }

  // normal hover behavior: a solid disc that shoves balls out of its way,
  // plus swipe momentum. Suspended while attracting so the disc doesn't
  // fight the inward pull. Off entirely when Collision is unchecked.
  if (p.mouseActive > 0.5 && solid && !attracting) {
    let dxy = x - p.mouse.xy;
    let d = length(dxy);
    if (d < reach) {
      let nrm = dxy / max(d, 0.001);
      let overlap = (reach - d) / reach;
      v += nrm * overlap * 2.0 + p.mouse.zw * 0.15;
    }
  }

  // hold attraction: local gravity well with 1/d falloff (same family as
  // ball-ball forces) — nearby balls get yanked hard, distant ones barely
  if (attracting) {
    let dxy = p.mouse.xy - x;
    let d = max(length(dxy), 1.0);
    v += (dxy / d) * ((charge * 55.0) / (d + 25.0));
  }

  // the "big bang": a decaying outward blast from the release point,
  // stronger for balls caught close to its center.
  if (p.interact.z > 0.001) {
    let dxy = x - p.interact.xy;
    let d = max(length(dxy), 8.0);
    v += (dxy / d) * (p.interact.z / d);
  }

  // Stokes (linear) + Newton (quadratic) drag, both driven by Friction —
  // the old Vitesse slider only retuned the quadratic term.
  // During unjam, ease friction so the pack can actually expand.
  let unjam = p._padPan.y;
  let fr = p.friction * (1.0 - 0.9 * unjam);
  v *= (1.0 - fr);
  var sp = length(v);
  if (sp > 0.0001) {
    let quadDrag = min(p.dragK * sp * sp * (1.0 - 0.9 * unjam), sp);
    v -= (v / sp) * quadDrag;
    sp = length(v);
  }
  // size-resize rescue: no ball left below the "immobile" threshold
  if (unjam > 0.01 && sp < 0.2) {
    let seed = f32(i) * 12.9898 + unjam * 78.233;
    let ang = fract(sin(seed) * 43758.5453) * (PI * 2.0);
    let kick = 0.35 + unjam * 0.65;
    v += vec2f(cos(ang), sin(ang)) * kick;
  }
  x += v;

  // hard constraint: the disc is solid, project any ball that ended up
  // inside back onto its edge and cancel inward velocity
  if (p.mouseActive > 0.5 && solid && !attracting) {
    let dxy = x - p.mouse.xy;
    let d = length(dxy);
    if (d < reach) {
      let nrm = dxy / max(d, 0.001);
      x = p.mouse.xy + nrm * reach;
      let vn = dot(v, nrm);
      if (vn < 0.0) { v -= nrm * vn; }
    }
  }

  // bounce off walls (always elastic)
  if (x.x < p.radius) { x.x = p.radius; v.x = -v.x; }
  if (x.x > p.size.x - p.radius) { x.x = p.size.x - p.radius; v.x = -v.x; }
  if (x.y < p.radius) { x.y = p.radius; v.y = -v.y; }
  if (x.y > p.size.y - p.radius) { x.y = p.size.y - p.radius; v.y = -v.y; }

  pos[i] = x;
  vel[i] = v;
}

// Jacobi positional peel: velocity forces cancel in a dense core (every push
// has an opposite neighbor), so overlapped interiors freeze at speed 0.
// Reading all positions then writing corrections expands the pack for real.
// Uses the same spatial hash as forces (no second rebuild) and a tight
// neighborhood — overlaps only exist within ~2×radius.
@compute @workgroup_size(256)
fn separate(@builtin(global_invocation_id) gid: vec3u) {
  let n = u32(p.count);
  let i = gid.x;
  if (i >= n) { return; }
  let myPos = pos[i];
  let minD = p.radius * 2.0;
  let minD2 = minD * minD;
  var corr = vec2f(0.0, 0.0);
  let neighR = neighFor(minD);
  let cc = cellCoord(myPos);
  let cols = i32(p.grid.x);
  let rows = i32(p.grid.y);

  for (var oy = -neighR; oy <= neighR; oy++) {
    let ny = cc.y + oy;
    if (ny < 0 || ny >= rows) { continue; }
    for (var ox = -neighR; ox <= neighR; ox++) {
      let nx = cc.x + ox;
      if (nx < 0 || nx >= cols) { continue; }
      let c = u32(ny * cols + nx);
      let start = offsets[c];
      let end = offsets[c + 1u];
      for (var s = start; s < end; s++) {
        let j = sortedIdx[s];
        if (j == i) { continue; }
        var dxy = pos[j] - myPos;
        var d2 = dot(dxy, dxy);
        if (d2 >= minD2) { continue; }
        if (d2 < 0.01) {
          let a = f32(i) * 12.9898 + f32(j) * 78.233;
          dxy = vec2f(cos(a), sin(a));
          d2 = 1.0;
        }
        let invD = inverseSqrt(d2);
        let d = d2 * invD;
        let dir = dxy * invD;
        corr -= dir * ((minD - d) * 0.5);
      }
    }
  }

  let clen = length(corr);
  if (clen > 0.0001) {
    let maxStep = max(p.radius * 2.0, 2.0);
    if (clen > maxStep) { corr *= maxStep / clen; }
    var x = myPos + corr * 0.85;
    x.x = clamp(x.x, p.radius, p.size.x - p.radius);
    x.y = clamp(x.y, p.radius, p.size.y - p.radius);
    pos[i] = x;
    vel[i] = vel[i] + corr * 0.35;
  }
}
`;

const WGSL_DRAW = /* wgsl */`
struct Params {
  size: vec2f,
  gGlobal: f32,
  friction: f32,
  gColor: f32,
  attractFlag: f32,
  radius: f32,
  count: f32,
  mouse: vec4f,
  mouseR: f32,
  mouseActive: f32,
  _p0: f32,
  zoom: f32,          // camera zoom, anchored on the canvas center
  grid: vec4f,
  interact: vec4f,    // explodeX, explodeY, explodeStrength, chargeStrength
  pan: vec2f,         // world-space pan offset
  _padPan: vec2f,
};
@group(0) @binding(0) var<uniform> p: Params;
@group(0) @binding(1) var<storage, read> pos: array<vec2f>;
@group(0) @binding(2) var<storage, read> col: array<vec4f>;

fn clipPos(world: vec2f) -> vec4f {
  let center = p.size * 0.5;
  let scaled = (world - center - p.pan) * p.zoom + center;
  return vec4f(scaled.x / p.size.x * 2.0 - 1.0, 1.0 - scaled.y / p.size.y * 2.0, 0.0, 1.0);
}

fn clipDelta(delta: vec2f) -> vec4f {
  let scaled = delta * p.zoom;
  return vec4f(scaled.x / p.size.x * 2.0, -scaled.y / p.size.y * 2.0, 0.0, 0.0);
}

fn quadCorner(vi: u32) -> vec2f {
  var q = array<vec2f, 6>(
    vec2f(-1.0, -1.0), vec2f(1.0, -1.0), vec2f(-1.0, 1.0),
    vec2f(-1.0, 1.0), vec2f(1.0, -1.0), vec2f(1.0, 1.0)
  );
  return q[vi];
}

struct BallOut {
  @builtin(position) posn: vec4f,
  @location(0) uv: vec2f,     // offset from ball center, world px
  @location(1) color: vec4f,
};

@vertex fn vsBall(@builtin(vertex_index) vi: u32,
                  @builtin(instance_index) ii: u32) -> BallOut {
  let corner = quadCorner(vi) * (p.radius + 1.0); // 1px pad for the soft edge
  var out: BallOut;
  out.posn = clipPos(pos[ii]) + clipDelta(corner);
  out.uv = corner;
  out.color = col[ii];
  return out;
}

@fragment fn fsBall(in: BallOut) -> @location(0) vec4f {
  let d = length(in.uv);
  let a = clamp(p.radius + 0.5 - d, 0.0, 1.0); // 1px antialiased rim
  return vec4f(in.color.rgb * a, a);            // premultiplied
}

struct RingOut {
  @builtin(position) posn: vec4f,
  @location(0) uv: vec2f,
};

@vertex fn vsRing(@builtin(vertex_index) vi: u32) -> RingOut {
  // grows with charge; scoop mode uses a slightly larger disc for the fill
  let scooping = p.mouseActive > 1.5;
  let r = p.mouseR + 3.0 + p.interact.w * 60.0 + select(0.0, 4.0, scooping);
  let corner = quadCorner(vi) * r;
  var out: RingOut;
  out.posn = clipPos(p.mouse.xy) + clipDelta(corner);
  out.uv = corner;
  return out;
}

@fragment fn fsRing(in: RingOut) -> @location(0) vec4f {
  let scooping = p.mouseActive > 1.5;
  let r = p.mouseR + p.interact.w * 60.0;
  let d = length(in.uv);
  // scoop: soft filled disc + thicker rim; idle: thin white ring
  if (scooping) {
    let fill = clamp((r - d) / max(r, 1.0), 0.0, 1.0) * 0.18;
    let rim = clamp(2.0 - abs(d - r), 0.0, 1.0) * 0.85;
    let a = max(fill, rim);
    return vec4f(a, a, a, a);
  }
  let a = clamp(1.25 - abs(d - r), 0.0, 1.0) * 0.7;
  return vec4f(a, a, a, a);
}
`;

const WGSL_POST = /* wgsl */`
// fade quad (trail effect) + blit of the scene texture to the canvas
@group(0) @binding(0) var samp: sampler;
@group(0) @binding(1) var tex: texture_2d<f32>;

struct VSOut {
  @builtin(position) posn: vec4f,
  @location(0) uv: vec2f,
};

@vertex fn vsFull(@builtin(vertex_index) vi: u32) -> VSOut {
  var xy = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  var out: VSOut;
  out.posn = vec4f(xy[vi], 0.0, 1.0);
  out.uv = vec2f(xy[vi].x * 0.5 + 0.5, 0.5 - xy[vi].y * 0.5);
  return out;
}

@fragment fn fsFade() -> @location(0) vec4f {
  // shorter trails so residual motion doesn't read as boiling
  return vec4f(0.035 * 0.55, 0.039 * 0.55, 0.055 * 0.55, 0.55);
}

@fragment fn fsBlit(in: VSOut) -> @location(0) vec4f {
  return textureSample(tex, samp, in.uv);
}
`;

/* ----------------------------- GPU engine ----------------------------- */

let gpu = null;

async function initGPU() {
  const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("WebGPU unavailable");
  const device = await adapter.requestDevice();
  const context = canvas.getContext("webgpu");
  const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format: canvasFormat, alphaMode: "opaque" });
  const q = device.queue;

  const uniBuf = device.createBuffer({ size: 112, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
  const posBuf = device.createBuffer({ size: posA.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const velBuf = device.createBuffer({ size: velA.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST | GPUBufferUsage.COPY_SRC });
  const hueBuf = device.createBuffer({ size: hueA.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });
  const colBuf = device.createBuffer({ size: colA.byteLength, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST });

  // spatial grid scratch buffers — fully rebuilt by the GPU every frame,
  // never touched from the CPU
  const cellIdBuf = device.createBuffer({ size: MAXN * 4, usage: GPUBufferUsage.STORAGE });
  const countsBuf = device.createBuffer({ size: MAXCELLS * 4, usage: GPUBufferUsage.STORAGE });
  const offsetsBuf = device.createBuffer({ size: (MAXCELLS + 1) * 4, usage: GPUBufferUsage.STORAGE });
  const sortedIdxBuf = device.createBuffer({ size: MAXN * 4, usage: GPUBufferUsage.STORAGE });

  // CPU readback staging (debug clipboard stats only)
  const posReadBuf = device.createBuffer({ size: MAXN * 8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });
  const velReadBuf = device.createBuffer({ size: MAXN * 8, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ });

  const simMod = device.createShaderModule({ code: WGSL_SIM });
  const drawMod = device.createShaderModule({ code: WGSL_DRAW });
  const postMod = device.createShaderModule({ code: WGSL_POST });

  // one shared layout for every sim pass (grid build + forces + integrate):
  // each pass only touches the bindings it needs, but "auto" layouts would
  // reject bindings an entry point doesn't reference, so this is explicit
  const simBGL = device.createBindGroupLayout({
    entries: [
      { binding: 0, visibility: GPUShaderStage.COMPUTE, buffer: { type: "uniform" } },
      { binding: 1, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 2, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 3, visibility: GPUShaderStage.COMPUTE, buffer: { type: "read-only-storage" } },
      { binding: 4, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 5, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 6, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
      { binding: 7, visibility: GPUShaderStage.COMPUTE, buffer: { type: "storage" } },
    ],
  });
  const simLayout = device.createPipelineLayout({ bindGroupLayouts: [simBGL] });
  const mkPipe = (entryPoint) => device.createComputePipeline({ layout: simLayout, compute: { module: simMod, entryPoint } });
  const clearCountsPipe = mkPipe("clearCounts");
  const countCellsPipe = mkPipe("countCells");
  const prefixSumPipe = mkPipe("prefixSum");
  const scatterPipe = mkPipe("scatter");
  const forcesPipe = mkPipe("forces");
  const integratePipe = mkPipe("integrate");
  const separatePipe = mkPipe("separate");

  const simBind = device.createBindGroup({
    layout: simBGL,
    entries: [
      { binding: 0, resource: { buffer: uniBuf } },
      { binding: 1, resource: { buffer: posBuf } },
      { binding: 2, resource: { buffer: velBuf } },
      { binding: 3, resource: { buffer: hueBuf } },
      { binding: 4, resource: { buffer: countsBuf } },
      { binding: 5, resource: { buffer: cellIdBuf } },
      { binding: 6, resource: { buffer: offsetsBuf } },
      { binding: 7, resource: { buffer: sortedIdxBuf } },
    ],
  });

  const SCENE_FORMAT = "rgba8unorm";
  const PREMUL = {
    color: { srcFactor: "one", dstFactor: "one-minus-src-alpha" },
    alpha: { srcFactor: "one", dstFactor: "one-minus-src-alpha" },
  };
  const ballPipe = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: drawMod, entryPoint: "vsBall" },
    fragment: { module: drawMod, entryPoint: "fsBall", targets: [{ format: SCENE_FORMAT, blend: PREMUL }] },
  });
  const ringPipe = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: drawMod, entryPoint: "vsRing" },
    fragment: { module: drawMod, entryPoint: "fsRing", targets: [{ format: SCENE_FORMAT, blend: PREMUL }] },
  });
  const fadePipe = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: postMod, entryPoint: "vsFull" },
    fragment: { module: postMod, entryPoint: "fsFade", targets: [{ format: SCENE_FORMAT, blend: PREMUL }] },
  });
  const blitPipe = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: postMod, entryPoint: "vsFull" },
    fragment: { module: postMod, entryPoint: "fsBlit", targets: [{ format: canvasFormat }] },
  });

  const ballBind = device.createBindGroup({
    layout: ballPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: uniBuf } },
      { binding: 1, resource: { buffer: posBuf } },
      { binding: 2, resource: { buffer: colBuf } },
    ],
  });
  const ringBind = device.createBindGroup({
    layout: ringPipe.getBindGroupLayout(0),
    entries: [{ binding: 0, resource: { buffer: uniBuf } }],
  });
  const sampler = device.createSampler({ magFilter: "linear", minFilter: "linear" });

  // trails live in an offscreen texture that is faded, not cleared,
  // each frame (the swapchain texture can't be relied on to persist)
  let sceneView = null, blitBind = null, freshScene = true;
  function makeScene() {
    const tex = device.createTexture({
      size: [Math.max(W, 1), Math.max(H, 1)],
      format: SCENE_FORMAT,
      usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.TEXTURE_BINDING,
    });
    sceneView = tex.createView();
    blitBind = device.createBindGroup({
      layout: blitPipe.getBindGroupLayout(0),
      entries: [
        { binding: 0, resource: sampler },
        { binding: 1, resource: sceneView },
      ],
    });
    freshScene = true;
  }
  makeScene();

  const uniData = new Float32Array(28);

  return {
    upload() {
      const n = params.count;
      q.writeBuffer(posBuf, 0, posA, 0, n * 2);
      q.writeBuffer(velBuf, 0, velA, 0, n * 2);
      q.writeBuffer(hueBuf, 0, hueA, 0, n);
      q.writeBuffer(colBuf, 0, colA, 0, n * 4);
    },

    resize() { makeScene(); },

    async readStats() {
      const n = params.count;
      if (n < 1) return null;
      const bytes = n * 8;
      const enc = device.createCommandEncoder();
      enc.copyBufferToBuffer(posBuf, 0, posReadBuf, 0, bytes);
      enc.copyBufferToBuffer(velBuf, 0, velReadBuf, 0, bytes);
      q.submit([enc.finish()]);
      await Promise.all([
        posReadBuf.mapAsync(GPUMapMode.READ, 0, bytes),
        velReadBuf.mapAsync(GPUMapMode.READ, 0, bytes),
      ]);
      const pos = new Float32Array(posReadBuf.getMappedRange(0, bytes).slice(0));
      const vel = new Float32Array(velReadBuf.getMappedRange(0, bytes).slice(0));
      posReadBuf.unmap();
      velReadBuf.unmap();

      let sx = 0, sy = 0, sumSp = 0, maxSp = 0, immobile = 0;
      for (let i = 0; i < n; i++) {
        sx += pos[i * 2];
        sy += pos[i * 2 + 1];
        const sp = Math.hypot(vel[i * 2], vel[i * 2 + 1]);
        sumSp += sp;
        if (sp > maxSp) maxSp = sp;
        if (sp < 0.05) immobile++;
      }
      const cx = sx / n, cy = sy / n;
      let sumR = 0, maxR = 0;
      for (let i = 0; i < n; i++) {
        const r = Math.hypot(pos[i * 2] - cx, pos[i * 2 + 1] - cy);
        sumR += r;
        if (r > maxR) maxR = r;
      }
      return {
        meanSpeed: sumSp / n,
        maxSpeed: maxSp,
        immobilePct: (100 * immobile) / n,
        clusterMeanR: sumR / n,
        clusterMaxR: maxR,
      };
    },

    frame() {
      const n = params.count;
      const grid = computeGrid(W, H);
      const dragK = Math.max(0.02, 0.01 + params.friction * 3.0);
      const gGlobal = params.gGlobal * 0.06;
      const gColor = params.gColor * 0.06;
      // Pelle: hover is pass-through; while held mouseActive=2 drives scoop in integrate
      const mouseActive = !mouse.active ? 0 : (mouse.scooping ? 2 : 1);
      const solid = params.paletScoop ? 0 : (params.paletSolid ? 1 : 0);
      uniData.set([
        W, H,
        gGlobal, params.friction,
        gColor, params.paletAttract ? 1 : 0,
        params.radius, n,
        mouse.x, mouse.y, mouse.vx, mouse.vy,
        mouse.radius, mouseActive, dragK, params.zoom,
        grid.cols, grid.rows, grid.cellW, grid.cellH,
        mouse.explodeX, mouse.explodeY, mouse.explodeNow, mouse.chargeNow,
        params.panX, params.panY, solid, unjamBoost,
      ]);
      q.writeBuffer(uniBuf, 0, uniData);

      const enc = device.createCommandEncoder();
      const nGroups = Math.ceil(n / 256);
      const cellGroups = Math.ceil(grid.numCells / 256);

      const cp = enc.beginComputePass();
      cp.setBindGroup(0, simBind);
      cp.setPipeline(clearCountsPipe); cp.dispatchWorkgroups(cellGroups);
      cp.setPipeline(countCellsPipe); cp.dispatchWorkgroups(nGroups);
      cp.setPipeline(prefixSumPipe); cp.dispatchWorkgroups(1);
      cp.setPipeline(scatterPipe); cp.dispatchWorkgroups(nGroups);
      cp.setPipeline(forcesPipe); cp.dispatchWorkgroups(nGroups);
      // same hash as forces (no second rebuild) — peel before integrate moves
      cp.setPipeline(separatePipe); cp.dispatchWorkgroups(nGroups);
      cp.setPipeline(integratePipe); cp.dispatchWorkgroups(nGroups);
      cp.end();

      const scene = enc.beginRenderPass({
        colorAttachments: [{
          view: sceneView,
          loadOp: freshScene ? "clear" : "load",
          clearValue: { r: 0.035, g: 0.039, b: 0.055, a: 1 },
          storeOp: "store",
        }],
      });
      freshScene = false;
      // fadePipe uses no bindings — and the scene texture must NOT be bound
      // here, since it's this pass's render attachment
      scene.setPipeline(fadePipe); scene.draw(3);
      scene.setPipeline(ballPipe); scene.setBindGroup(0, ballBind); scene.draw(6, n);
      if (mouse.active) {
        scene.setPipeline(ringPipe); scene.setBindGroup(0, ringBind); scene.draw(6);
      }
      scene.end();

      const blit = enc.beginRenderPass({
        colorAttachments: [{
          view: context.getCurrentTexture().createView(),
          loadOp: "clear",
          clearValue: { r: 0, g: 0, b: 0, a: 1 },
          storeOp: "store",
        }],
      });
      blit.setPipeline(blitPipe); blit.setBindGroup(0, blitBind); blit.draw(3);
      blit.end();

      q.submit([enc.finish()]);
    },
  };
}

/* ------------------------------ main loop ----------------------------- */

// balls can only be placed once the stage actually has a size — at load
// the tab may still be hidden or unlaid-out, with clientWidth/Height at 0
let placed = false;

function resize() {
  W = canvas.width = Math.max(1, stage.clientWidth);
  H = canvas.height = Math.max(1, stage.clientHeight);
  clampPan();
  if (!placed && stage.clientWidth > 0 && stage.clientHeight > 0) {
    placed = true;
    makeBalls(params.count);
  }
  // out-of-bounds balls are pulled back by the wall clamp in the shader
  if (gpu) gpu.resize();
}
new ResizeObserver(resize).observe(stage);

function frame() {
  // charge ramps up while the button is held, and resets once released
  mouse.chargeNow = mouse.charging
    ? Math.min(1, (performance.now() - mouse.chargeStart) / CHARGE_RAMP_MS) * CHARGE_MAX
    : 0;
  // the blast fades linearly over EXPLODE_FRAMES, then goes fully silent
  if (mouse.explodeTimer > 0) {
    mouse.explodeNow = mouse.explodeStrength0 * (mouse.explodeTimer / EXPLODE_FRAMES);
    mouse.explodeTimer--;
  } else {
    mouse.explodeNow = 0;
  }
  if (unjamBoost > 0) {
    unjamBoost = Math.max(0, unjamBoost - 1 / 45);
  }

  gpu.frame();
  if (mouse.active) {
    // decay swipe momentum so a stopped cursor stops pushing
    mouse.vx *= 0.8;
    mouse.vy *= 0.8;
  }
  requestAnimationFrame(frame);
}

// controls
function bind(id, outId, fmt, apply) {
  const el = document.getElementById(id);
  const out = document.getElementById(outId);
  el.addEventListener("input", () => {
    const v = parseFloat(el.value);
    out.textContent = fmt(v);
    apply(v);
    saveSettings();
  });
}
bind("count", "countOut", v => v, v => makeBalls(v));
bind("gGlobal", "gGlobalOut", v => v.toFixed(1), v => { params.gGlobal = v; });
bind("gColor", "gColorOut", v => v.toFixed(1), v => { params.gColor = v; });
bind("friction", "frictionOut", v => v.toFixed(3), v => { params.friction = v; });
bind("mouseR", "mouseROut", v => v, v => { mouse.radius = v; });
document.getElementById("paletSolid").addEventListener("change", (e) => {
  params.paletSolid = e.target.checked;
  saveSettings();
});
document.getElementById("paletAttract").addEventListener("change", (e) => {
  params.paletAttract = e.target.checked;
  saveSettings();
});
document.getElementById("paletBang").addEventListener("change", (e) => {
  params.paletBang = e.target.checked;
  saveSettings();
});
document.getElementById("paletScoop").addEventListener("change", (e) => {
  params.paletScoop = e.target.checked;
  if (!params.paletScoop) mouse.scooping = false;
  saveSettings();
});
bind("size", "sizeOut", v => v, v => {
  params.radius = v / 2;
  // growing after a shrink leaves everyone stacked inside the new diameter —
  // kick the GPU unjam so soft push expands the pack and nothing stays frozen
  unjamBoost = 1;
});
bind("zoom", "zoomOut", v => v.toFixed(1) + "×", v => setZoom(v));
document.getElementById("palette").addEventListener("change", (e) => {
  params.palette = e.target.value;
  makeBalls(params.count);
  saveSettings();
});
document.getElementById("reset").addEventListener("click", () => makeBalls(params.count));

async function copyDebug() {
  const btn = document.getElementById("debugCopy");
  const lines = [
    "Color Gravity debug",
    `canvas=${W}x${H}`,
    `count=${params.count} diameter=${params.radius * 2} radius=${params.radius}`,
    `palette=${params.palette}`,
    `gGlobal=${params.gGlobal} gColor=${params.gColor} friction=${params.friction}`,
    `zoom=${params.zoom} pan=${params.panX.toFixed(1)},${params.panY.toFixed(1)}`,
    `palet: size=${mouse.radius} solid=${params.paletSolid ? 1 : 0} attract=${params.paletAttract ? 1 : 0} bang=${params.paletBang ? 1 : 0} scoop=${params.paletScoop ? 1 : 0}`,
  ];
  if (gpu && gpu.readStats) {
    try {
      const s = await gpu.readStats();
      if (s) {
        lines.push(
          `speed: mean=${s.meanSpeed.toFixed(3)} max=${s.maxSpeed.toFixed(3)} immobile(<0.05)=${s.immobilePct.toFixed(1)}%`,
          `cluster: meanR=${s.clusterMeanR.toFixed(1)} maxR=${s.clusterMaxR.toFixed(1)}`,
        );
      }
    } catch (err) {
      lines.push(`stats: error (${err && err.message ? err.message : err})`);
    }
  } else {
    lines.push("stats: gpu not ready");
  }
  const text = lines.join("\n");
  try {
    await navigator.clipboard.writeText(text);
    btn.classList.add("ok");
    btn.textContent = "Copié";
    setTimeout(() => {
      btn.classList.remove("ok");
      btn.textContent = "Debug";
    }, 1200);
  } catch (err) {
    btn.textContent = "Échec";
    console.error(err);
    setTimeout(() => { btn.textContent = "Debug"; }, 1200);
  }
}
document.getElementById("debugCopy").addEventListener("click", () => { copyDebug(); });

resize();
initGPU().then((g) => {
  gpu = g;
  gpu.upload(); // no-op zeros if placement hasn't happened yet; makeBalls re-uploads
  requestAnimationFrame(frame);
}).catch((err) => {
  console.error(err);
  stage.innerHTML = '<p class="nogpu">WebGPU indisponible — utilisez une version récente de Chrome, Brave, Edge ou Safari.</p>';
});
</script>
