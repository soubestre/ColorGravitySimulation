<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fractals</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  :root {
    --bg: #0d0f14;
    --panel: #171a22;
    --text: #d7dae2;
    --muted: #8a8fa0;
    --accent: #6e9fff;
    --warm: #ff9a5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    height: 100vh;
    padding: 16px;
    gap: 12px;
    overflow: hidden;
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.02em; flex-shrink: 0; }
  h1 span { color: var(--muted); font-weight: 400; font-size: 0.85rem; margin-left: 8px; }
  h1 a.nav {
    margin-left: 14px;
    font-size: 0.75rem;
    font-weight: 500;
    color: var(--muted);
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 8px;
    padding: 4px 10px;
    vertical-align: middle;
  }
  h1 a.nav:hover { color: var(--text); background: rgba(255,255,255,0.06); }
  #viewport {
    flex: 1;
    align-self: stretch;
    min-height: 0;
    display: flex;
    gap: 12px;
  }
  #stage { flex: 1; min-width: 0; }
  #viewPanel {
    flex-shrink: 0;
    width: 56px;
    background: var(--panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 0;
  }
  #viewPanel .group-title {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  #viewPanel output {
    color: var(--text);
    font-size: 0.7rem;
    font-variant-numeric: tabular-nums;
  }
  #zoom {
    writing-mode: vertical-lr;
    direction: rtl;
    width: 20px;
    height: 150px;
    accent-color: var(--accent);
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 12px;
    background: #05060a;
    box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    touch-action: none;
  }
  .nogpu {
    display: grid;
    place-items: center;
    height: 100%;
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    padding: 24px;
  }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 0;
    align-items: stretch;
    background: var(--panel);
    border-radius: 12px;
    padding: 10px 14px;
    flex-shrink: 0;
  }
  .group {
    display: flex;
    flex-direction: column;
    gap: 5px;
    padding: 0 14px;
  }
  .group + .group { border-left: 1px solid rgba(255,255,255,0.08); }
  .group-title {
    font-size: 0.6rem;
    font-weight: 600;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .group-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .controls > button { align-self: center; margin-left: 10px; }
  .control { display: flex; flex-direction: column; gap: 2px; }
  select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 6px;
    padding: 3px 6px;
    font-size: 0.75rem;
  }
  .control label {
    font-size: 0.65rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .control label output { color: var(--text); }
  input[type="range"] {
    width: 90px;
    accent-color: var(--accent);
  }
  label.check {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text);
    cursor: pointer;
    user-select: none;
    align-self: center;
  }
  label.check input {
    accent-color: var(--accent);
    width: 14px;
    height: 14px;
    margin: 0;
  }
  button {
    background: var(--accent);
    color: #0d0f14;
    border: none;
    border-radius: 8px;
    padding: 7px 14px;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { filter: brightness(1.1); }
  button.ghost {
    background: transparent;
    color: var(--muted);
    border: 1px solid rgba(255,255,255,0.14);
    font-weight: 500;
  }
  button.ghost:hover { color: var(--text); filter: none; background: rgba(255,255,255,0.06); }
  button.ghost.active { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>
<h1>Fractals <span>Mandelbrot / Julia</span>
  <a class="nav" href="index.html">Color Gravity</a>
  <a class="nav" href="galaxies.html">Galaxies</a>
</h1>
<div id="viewport">
  <div id="stage"><canvas id="sim"></canvas></div>
  <div id="viewPanel">
    <span class="group-title">Zoom</span>
    <input type="range" id="zoom" min="0" max="100" step="1" value="30">
    <output id="zoomOut">1.0</output>
  </div>
</div>
<p id="warnOut" style="display:none;color:var(--warm,#ff9a5c);font-size:0.75rem;flex-shrink:0;"></p>
<div class="controls">
  <div class="group">
    <span class="group-title">Mode</span>
    <div class="group-row">
      <div class="control">
        <label>Formule</label>
        <select id="mode">
          <option value="0">Mandelbrot</option>
          <option value="1">Julia</option>
        </select>
      </div>
      <output id="qualityOut" style="align-self:center;font-size:0.7rem;color:var(--muted);">—</output>
    </div>
  </div>
  <div class="group">
    <span class="group-title">Julia</span>
    <div class="group-row">
      <div class="control">
        <label>Re(c) <output id="cReOut">-0.40</output></label>
        <input type="range" id="cRe" min="-2" max="2" step="0.001" value="-0.4">
      </div>
      <div class="control">
        <label>Im(c) <output id="cImOut">0.60</output></label>
        <input type="range" id="cIm" min="-2" max="2" step="0.001" value="0.6">
      </div>
    </div>
  </div>
  <div class="group">
    <span class="group-title">Iter</span>
    <div class="group-row">
      <div class="control">
        <label>Max <output id="iterOut">256</output></label>
        <input type="range" id="maxIter" min="50" max="2000" step="10" value="256">
      </div>
    </div>
  </div>
  <div class="group">
    <span class="group-title">Color</span>
    <div class="group-row">
      <div class="control">
        <label>Palette</label>
        <select id="palette">
          <option value="0">Fire</option>
          <option value="1">Ocean</option>
          <option value="2">Mono</option>
        </select>
      </div>
      <div class="control">
        <label>Phase <output id="phaseOut">0.00</output></label>
        <input type="range" id="phase" min="0" max="1" step="0.01" value="0">
      </div>
    </div>
  </div>
  <div class="group">
    <span class="group-title">Vue</span>
    <div class="group-row">
      <output id="centerOut" style="font-size:0.7rem;color:var(--muted);font-variant-numeric:tabular-nums;">−0.5 + 0.0i</output>
    </div>
  </div>
  <button id="reset" type="button">Reset</button>
</div>
<script>
"use strict";
// Tasks 2–5 fill this in. Keep #sim canvas in the DOM (do not replace stage.innerHTML).
const canvas = document.getElementById("sim");
const stage = document.getElementById("stage");

const view = { cx: -0.5, cy: 0, scale: 1.2 };
const SCALE_MAX = 3.0;
const SCALE_MIN = 1e-6;
const PRECISION_SCALE = 1e-5;

function screenToComplex(sx, sy, W, H, v) {
  const aspect = W / H;
  const x = v.cx + (sx / W - 0.5) * 2 * v.scale * aspect;
  const y = v.cy + (0.5 - sy / H) * 2 * v.scale;
  return { x, y };
}

function panBy(v, dsx, dsy, W, H) {
  const aspect = W / H;
  v.cx -= (dsx / W) * 2 * v.scale * aspect;
  v.cy += (dsy / H) * 2 * v.scale;
}

function zoomAt(v, sx, sy, W, H, factor) {
  const before = screenToComplex(sx, sy, W, H, v);
  v.scale = Math.min(SCALE_MAX, Math.max(SCALE_MIN, v.scale * factor));
  const after = screenToComplex(sx, sy, W, H, v);
  v.cx += before.x - after.x;
  v.cy += before.y - after.y;
}

function zoomSliderToScale(t) {
  return Math.exp(Math.log(SCALE_MAX) + t * (Math.log(SCALE_MIN) - Math.log(SCALE_MAX)));
}

function scaleToZoomSlider(scale) {
  return (Math.log(scale) - Math.log(SCALE_MAX)) / (Math.log(SCALE_MIN) - Math.log(SCALE_MAX));
}

const quality = {
  interacting: false,
  draftScale: 0.25,
  draftIterCap: 128,
  idleMs: 100,
};

function getRenderBudget(q, userMaxIter, canvasW, canvasH) {
  if (q.interacting) {
    const rw = Math.max(1, Math.floor(canvasW * q.draftScale));
    const rh = Math.max(1, Math.floor(canvasH * q.draftScale));
    return {
      rw, rh,
      maxIter: Math.min(userMaxIter, q.draftIterCap),
      draft: true,
    };
  }
  return { rw: canvasW, rh: canvasH, maxIter: userMaxIter, draft: false };
}

const NOGPU_MSG = "WebGPU indisponible — utilisez une version récente de Chrome, Brave, Edge ou Safari.";

const WGSL_UNIFORMS = /* wgsl */ `
struct Uniforms {
  cx: f32, cy: f32, scale: f32, maxIter: f32,
  cRe: f32, cIm: f32, mode: f32, phase: f32,
  palette: f32, resX: f32, resY: f32, canvasW: f32,
  canvasH: f32, _pad1: f32, _pad2: f32, _pad3: f32,
};
`;

const WGSL_ESCAPE = /* wgsl */ `
${WGSL_UNIFORMS}
@group(0) @binding(0) var<uniform> U: Uniforms;
@group(0) @binding(1) var escapeTex: texture_storage_2d<r32float, write>;

@compute @workgroup_size(8, 8)
fn csEscape(@builtin(global_invocation_id) gid: vec3u) {
  let rw = u32(U.resX); let rh = u32(U.resY);
  if (gid.x >= rw || gid.y >= rh) { return; }
  let aspect = U.resX / U.resY;
  let uv = vec2f(
    (f32(gid.x) + 0.5) / U.resX,
    (f32(gid.y) + 0.5) / U.resY
  );
  let px = U.cx + (uv.x - 0.5) * 2.0 * U.scale * aspect;
  let py = U.cy + (0.5 - uv.y) * 2.0 * U.scale;

  var zx: f32; var zy: f32; var cx: f32; var cy: f32;
  if (U.mode < 0.5) {
    zx = 0.0; zy = 0.0; cx = px; cy = py; // Mandelbrot
  } else {
    zx = px; zy = py; cx = U.cRe; cy = U.cIm; // Julia
  }

  var i: u32 = 0u;
  let maxI = u32(U.maxIter);
  var escaped = false;
  loop {
    if (i >= maxI) { break; }
    let x2 = zx * zx; let y2 = zy * zy;
    if (x2 + y2 > 256.0) { escaped = true; break; }
    zy = 2.0 * zx * zy + cy;
    zx = x2 - y2 + cx;
    i = i + 1u;
  }

  var t = f32(maxI); // interior
  if (escaped) {
    // smooth escape
    let logZn = log(zx * zx + zy * zy) / 2.0;
    let nu = log(logZn / log(2.0)) / log(2.0);
    t = f32(i) + 1.0 - nu;
  }
  textureStore(escapeTex, vec2i(gid.xy), vec4f(t, 0.0, 0.0, 0.0));
}
`;

const WGSL_BLIT = /* wgsl */ `
${WGSL_UNIFORMS}
@group(0) @binding(0) var escapeTex: texture_2d<f32>;
@group(0) @binding(1) var<uniform> U: Uniforms;

fn paletteColor(t: f32, pal: f32, phase: f32) -> vec3f {
  let x = t * 0.015 + phase;
  if (pal < 0.5) {
    // fire
    return vec3f(
      0.5 + 0.5 * sin(6.28318 * (x + 0.0)),
      0.5 + 0.5 * sin(6.28318 * (x + 0.33)),
      0.2 + 0.3 * sin(6.28318 * (x + 0.67))
    );
  } else if (pal < 1.5) {
    // ocean
    return vec3f(
      0.1 + 0.3 * sin(6.28318 * (x + 0.2)),
      0.3 + 0.4 * sin(6.28318 * (x + 0.4)),
      0.5 + 0.5 * sin(6.28318 * (x + 0.0))
    );
  }
  // mono
  let g = 0.5 + 0.5 * sin(6.28318 * x);
  return vec3f(g, g, g);
}

@vertex
fn vsFull(@builtin(vertex_index) vi: u32) -> @builtin(position) vec4f {
  var xy = array<vec2f, 3>(vec2f(-1.0, -1.0), vec2f(3.0, -1.0), vec2f(-1.0, 3.0));
  return vec4f(xy[vi], 0.0, 1.0);
}

@fragment
fn fsBlit(@builtin(position) pos: vec4f) -> @location(0) vec4f {
  let uv = pos.xy / vec2f(U.canvasW, U.canvasH);
  let texCoord = vec2i(uv * vec2f(U.resX, U.resY));
  let t = textureLoad(escapeTex, texCoord, 0).r;
  if (t >= U.maxIter - 0.5) {
    return vec4f(0.02, 0.03, 0.05, 1.0); // interior
  }
  let col = paletteColor(t, U.palette, U.phase);
  return vec4f(col, 1.0);
}
`;

const UNIFORM_FLOATS = 24; // 96 bytes
const UNIFORM_BYTES = UNIFORM_FLOATS * 4;

let gpu = null;

function showNoGpu() {
  stage.className = "nogpu";
  stage.textContent = NOGPU_MSG;
}

async function initGPU() {
  const adapter = navigator.gpu && await navigator.gpu.requestAdapter();
  if (!adapter) throw new Error("WebGPU unavailable");
  const device = await adapter.requestDevice();
  const context = canvas.getContext("webgpu");
  if (!context) throw new Error("WebGPU canvas context unavailable");
  const canvasFormat = navigator.gpu.getPreferredCanvasFormat();
  context.configure({ device, format: canvasFormat, alphaMode: "opaque" });

  device.lost.then(() => showNoGpu());

  const uniBuf = device.createBuffer({
    size: UNIFORM_BYTES,
    usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST,
  });

  const escapeMod = device.createShaderModule({ code: WGSL_ESCAPE });
  const blitMod = device.createShaderModule({ code: WGSL_BLIT });

  const computePipe = device.createComputePipeline({
    layout: "auto",
    compute: { module: escapeMod, entryPoint: "csEscape" },
  });
  const blitPipe = device.createRenderPipeline({
    layout: "auto",
    vertex: { module: blitMod, entryPoint: "vsFull" },
    fragment: { module: blitMod, entryPoint: "fsBlit", targets: [{ format: canvasFormat }] },
  });

  gpu = {
    device,
    context,
    canvasFormat,
    uniBuf,
    uniData: new Float32Array(UNIFORM_FLOATS),
    computePipe,
    blitPipe,
    escapeTex: null,
    escapeView: null,
    sampleTex: null,
    sampleView: null,
    useTwin: false,
    computeBind: null,
    blitBind: null,
    escapeW: 0,
    escapeH: 0,
  };
}

function destroyTex(tex) {
  if (tex) tex.destroy();
}

function resizeEscape(rw, rh) {
  if (!gpu) return;
  rw = Math.max(1, rw | 0);
  rh = Math.max(1, rh | 0);
  if (gpu.escapeTex && gpu.escapeW === rw && gpu.escapeH === rh) return;

  destroyTex(gpu.escapeTex);
  destroyTex(gpu.sampleTex);
  gpu.escapeTex = null;
  gpu.sampleTex = null;
  gpu.useTwin = false;

  const combinedUsage =
    GPUTextureUsage.STORAGE_BINDING |
    GPUTextureUsage.TEXTURE_BINDING |
    GPUTextureUsage.COPY_SRC;

  try {
    gpu.escapeTex = gpu.device.createTexture({
      size: [rw, rh],
      format: "r32float",
      usage: combinedUsage,
    });
    gpu.escapeView = gpu.escapeTex.createView();
    gpu.sampleView = gpu.escapeView;
  } catch (_) {
    gpu.useTwin = true;
    gpu.escapeTex = gpu.device.createTexture({
      size: [rw, rh],
      format: "r32float",
      usage: GPUTextureUsage.STORAGE_BINDING | GPUTextureUsage.COPY_SRC,
    });
    gpu.sampleTex = gpu.device.createTexture({
      size: [rw, rh],
      format: "r32float",
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST,
    });
    gpu.escapeView = gpu.escapeTex.createView();
    gpu.sampleView = gpu.sampleTex.createView();
  }

  gpu.escapeW = rw;
  gpu.escapeH = rh;

  gpu.computeBind = gpu.device.createBindGroup({
    layout: gpu.computePipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: { buffer: gpu.uniBuf } },
      { binding: 1, resource: gpu.escapeView },
    ],
  });
  gpu.blitBind = gpu.device.createBindGroup({
    layout: gpu.blitPipe.getBindGroupLayout(0),
    entries: [
      { binding: 0, resource: gpu.sampleView },
      { binding: 1, resource: { buffer: gpu.uniBuf } },
    ],
  });
}

function renderFrame(opts) {
  if (!gpu) return;
  const {
    rw, rh, maxIter,
    cx, cy, scale,
    mode, cRe, cIm,
    palette, phase,
    canvasW, canvasH,
  } = opts;

  if (!gpu.escapeTex || gpu.escapeW !== rw || gpu.escapeH !== rh) {
    resizeEscape(rw, rh);
  }

  const U = gpu.uniData;
  U[0] = cx; U[1] = cy; U[2] = scale; U[3] = maxIter;
  U[4] = cRe; U[5] = cIm; U[6] = mode; U[7] = phase;
  U[8] = palette; U[9] = rw; U[10] = rh; U[11] = canvasW;
  U[12] = canvasH;
  gpu.device.queue.writeBuffer(gpu.uniBuf, 0, U);

  const encoder = gpu.device.createCommandEncoder();
  {
    const pass = encoder.beginComputePass();
    pass.setPipeline(gpu.computePipe);
    pass.setBindGroup(0, gpu.computeBind);
    pass.dispatchWorkgroups(Math.ceil(rw / 8), Math.ceil(rh / 8));
    pass.end();
  }

  if (gpu.useTwin) {
    encoder.copyTextureToTexture(
      { texture: gpu.escapeTex },
      { texture: gpu.sampleTex },
      [rw, rh]
    );
  }

  {
    const pass = encoder.beginRenderPass({
      colorAttachments: [{
        view: gpu.context.getCurrentTexture().createView(),
        clearValue: { r: 0.02, g: 0.03, b: 0.05, a: 1 },
        loadOp: "clear",
        storeOp: "store",
      }],
    });
    pass.setPipeline(gpu.blitPipe);
    pass.setBindGroup(0, gpu.blitBind);
    pass.draw(3);
    pass.end();
  }

  gpu.device.queue.submit([encoder.finish()]);
}

function syncCanvasSize() {
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(1, Math.floor(rect.width * dpr));
  const h = Math.max(1, Math.floor(rect.height * dpr));
  if (canvas.width !== w || canvas.height !== h) {
    canvas.width = w;
    canvas.height = h;
  }
  return { canvasW: canvas.width, canvasH: canvas.height };
}

(async function boot() {
  const { canvasW, canvasH } = syncCanvasSize();
  try {
    await initGPU();
  } catch (err) {
    console.warn(err);
    showNoGpu();
    return;
  }
  const budget = getRenderBudget(quality, 256, canvasW, canvasH);
  resizeEscape(budget.rw, budget.rh);
  renderFrame({
    rw: budget.rw,
    rh: budget.rh,
    maxIter: budget.maxIter,
    cx: view.cx,
    cy: view.cy,
    scale: view.scale,
    mode: 0,
    cRe: -0.4,
    cIm: 0.6,
    palette: 0,
    phase: 0,
    canvasW,
    canvasH,
  });
})();
</script>
</body>
</html>
